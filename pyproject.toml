[project]
name = "taxi-pipeline"
version = "0.1.0"
description = "Taxi data processing pipeline"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
